name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-13, macos-14, macos-15, macos-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup
      run: brew install boost google-sparsehash multimarkdown ninja ragel
    - name: Configure
      run: ./configure
    - name: Build
      run: ninja TextMate
